<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><style>
:root { --pad: 24px; --bg: #2563eb; --weight: 600; --radius: 12px; --font-size: 16px; }
body { margin: 0; padding: 40px; background: #f3f4f6; font-family: Arial, sans-serif; }
#target { display: flex; justify-content: space-between; align-items: center; width: 600px; padding: var(--pad); background: var(--bg); color: #fff; border-radius: var(--radius); font-size: var(--font-size); font-weight: var(--weight); }
#target span { margin-left: 20px; }
</style></head><body>
<div id="target"><div>Logo</div><div><span>Home</span><span>About</span><span>Contact</span></div></div>
</body></html>
