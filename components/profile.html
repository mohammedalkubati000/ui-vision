<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><style>
:root { --pad: 24px; --bg: #2563eb; --weight: 600; --radius: 12px; --font-size: 16px; }
body { margin: 0; padding: 40px; background: #f3f4f6; font-family: Arial, sans-serif; }
#target { display: flex; align-items: center; gap: 12px; width: 300px; padding: var(--pad); background: var(--bg); color: #fff; border-radius: var(--radius); font-size: var(--font-size); }
.dot { width: 40px; height: 40px; border-radius: 50%; background: #fff; }
.name { font-weight: var(--weight); }
.role { opacity: 0.8; font-size: 0.85em; }
</style></head><body>
<div id="target"><div class="dot"></div><div><div class="name">Sara Ahmed</div><div class="role">Product Designer</div></div></div>
</body></html>
