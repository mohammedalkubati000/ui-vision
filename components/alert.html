<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><style>
:root { --pad: 24px; --bg: #2563eb; --weight: 600; --radius: 12px; --font-size: 16px; }
body { margin: 0; padding: 40px; background: #f3f4f6; font-family: Arial, sans-serif; }
#target { width: 360px; padding: var(--pad); background: var(--bg); color: #fff; border-radius: var(--radius); font-size: var(--font-size); }
#target h3 { margin: 0 0 8px; font-weight: var(--weight); }
#target p { margin: 0; }
</style></head><body>
<div id="target"><h3>Heads up</h3><p>Your changes have been saved successfully.</p></div>
</body></html>
