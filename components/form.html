<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><style>
:root { --pad: 24px; --bg: #2563eb; --weight: 600; --radius: 12px; --font-size: 16px; }
body { margin: 0; padding: 40px; background: #f3f4f6; font-family: Arial, sans-serif; }
#target { width: 300px; padding: var(--pad); background: var(--bg); color: #fff; border-radius: var(--radius); font-size: var(--font-size); }
#target label { display: block; margin-bottom: 6px; font-weight: var(--weight); }
#target input { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 16px; border: none; border-radius: 6px; }
#target button { padding: 10px 20px; border: none; border-radius: 8px; background: #fff; color: #111; font-weight: 600; }
</style></head><body>
<div id="target"><label>Email</label><input type="text"><button>Submit</button></div>
</body></html>
